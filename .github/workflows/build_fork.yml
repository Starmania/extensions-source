name: Contributor build

# Runs in forks only: builds what a branch changes on top of upstream and publishes it to an
# extension repo held by the fork itself (its `repo` branch and releases).
on:
  push:
    branches:
      - '**'
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_fork.yml'
  delete:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 80
  BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}

jobs:
  prepare:
    name: Prepare job
    if: >-
      github.repository != 'keiyoushi/extensions-source' &&
      (github.event_name == 'push' || github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      channel: ${{ steps.channel.outputs.id }}
      signing_key: ${{ steps.signing.outputs.fingerprint }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'delete' && 1 || 0 }}
          persist-credentials: false

      - id: channel
        name: Derive channel
        run: |
          # Starts with a letter since it becomes a segment of the application id
          hash=$(printf '%s' "$GITHUB_REPOSITORY@$BRANCH" | sha256sum | cut -c 1-10)
          echo "id=c$hash" >> "$GITHUB_OUTPUT"

      - id: signing
        name: Get signing key fingerprint
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -o pipefail
          # Without a signing key every run signs with a new debug key, which can't be
          # updated from: the branch is built but not published.
          if [ -z "$SIGNING_KEY" ]; then
            echo "::notice::No SIGNING_KEY secret, nothing will be published"
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/signingkey.jks"
          fingerprint=$(
            keytool -exportcert -keystore "$RUNNER_TEMP/signingkey.jks" \
              -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" | sha256sum | cut -d ' ' -f 1
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - id: generate-matrices
        name: Create output matrices
        run: |
          if [ "$GITHUB_EVENT_NAME" = "delete" ]; then
            echo 'matrix={"chunk":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags https://github.com/keiyoushi/extensions-source.git main
          python ./.github/scripts/generate-build-matrices.py "$(git merge-base FETCH_HEAD HEAD)"

  build:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Prepare signing key
        if: needs.prepare.outputs.signing_key != ''
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > signingkey.jks

      - name: Build extensions (${{ matrix.chunk.number }})
        env:
          MODULES: ${{ join(matrix.chunk.modules, ' ') }}
          KEI_CHANNEL: ${{ needs.prepare.outputs.channel }}
          KEI_CHANNEL_LABEL: ${{ env.BRANCH }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TASKS=()
          for module in $MODULES; do
            TASKS+=("${module}:assembleRelease")
          done
          ./gradlew "${TASKS[@]}"

      - name: Upload APKs (${{ matrix.chunk.number }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.prepare.outputs.signing_key != ''
        with:
          name: "individual-apks-${{ matrix.chunk.number }}"
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/jar/release/*.jar
            **/build/keiyoushi-source-info.json
          retention-days: 1

      - name: Clean up CI files
        if: always()
        run: rm -f signingkey.jks

  publish:
    name: Publish extension repo
    needs: [prepare, build]
    # Also runs without a build, to drop what a deleted or reverted branch had published
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.signing_key != '' &&
      needs.build.result != 'failure' &&
      needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Every branch publishes into the same `repo` branch
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    steps:
      - name: Download APK artifacts
        if: needs.build.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ~/apk-artifacts

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Checkout repo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if git ls-remote --exit-code --heads "$url" repo; then
            git clone --depth 1 --branch repo "$url" repo
          else
            git init --initial-branch repo repo
            git -C repo remote add origin "$url"
            echo '{}' > repo/index.json
          fi

      - name: Publish and deploy repo
        env:
          KEI_CHANNEL: ${{ needs.prepare.outputs.channel }}
          SIGNING_KEY_FINGERPRINT: ${{ needs.prepare.outputs.signing_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          pip install protobuf
          python -u ../main/.github/scripts/publish-repo.py "[]" "$GITHUB_SHA" false
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update extensions repo"
            git push origin repo
          else
            echo "No changes to commit"
          fi
          echo "Extension repo: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/repo/index.pb" >> "$GITHUB_STEP_SUMMARY"
